name: Finalize source migration
on: workflow_dispatch
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Preserve Mac launcher executable mode
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git update-index --chmod=+x 'Avvia MyMoney.command'
          git commit -m 'Preserve executable Mac launcher after source import'
          git push origin HEAD:main
